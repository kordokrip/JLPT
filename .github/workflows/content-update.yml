name: Content and D1 Change Control

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'packages/db/drizzle-v2/**'
      - 'packages/db/src/seed/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'packages/db/drizzle-v2/**'
      - 'packages/db/src/seed/**'
  workflow_dispatch:
    inputs:
      operation:
        description: Approved production operation
        required: true
        type: choice
        options: [validate, migrate, seed]
        default: validate
      database:
        description: Exact D1 database name (production changes only)
        required: false
        default: nihongo-n3-prod-v2
      confirmation:
        description: Type APPLY for migrate or seed
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Fresh D1 Migrate, Seed, Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @nihongo-n3/db typecheck
      - run: pnpm -F @nihongo-n3/db verify:fresh

  production-change:
    name: Approved Production D1 Change
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation != 'validate' &&
      inputs.confirmation == 'APPLY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_WRITE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply approved operation
        env:
          OPERATION: ${{ inputs.operation }}
          DATABASE: ${{ inputs.database }}
        run: |
          if [ "$OPERATION" = "migrate" ]; then
            ALLOW_PRODUCTION_CHANGE=migrations pnpm --filter @nihongo-n3/db exec tsx src/ops/apply-migrations.ts --database="$DATABASE"
          elif [ "$OPERATION" = "seed" ]; then
            ALLOW_PRODUCTION_CHANGE=seed pnpm --filter @nihongo-n3/db exec tsx src/seed/seed.ts --remote --database="$DATABASE"
            pnpm --filter @nihongo-n3/db exec tsx src/seed/verify.ts --remote --database="$DATABASE"
          fi
