name: Required Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Type, Unit, Build, D1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:ci
      - name: Upload D1 verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-verification
          path: .artifacts/db/
          if-no-files-found: ignore
          retention-days: 14
