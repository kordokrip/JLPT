name: Backup D1 Database → R2

# 매일 15:00 UTC = 한국 자정(KST 00:00) run 생성
# production Environment에서 maintenance/read-only window를 확인한 사람이 승인해야 실행됨
# R2 lifecycle rule: 30일 이후 자동 만료 (아래 setup-lifecycle 잡 참고)

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date_override:
        description: "백업 날짜 덮어쓰기 (YYYY-MM-DD, 빈 칸이면 오늘)"
        required: false
        default: ""

concurrency:
  group: backup-d1-to-r2
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. D1 export → R2 업로드
  # ─────────────────────────────────────────────────────────────────
  backup:
    name: D1 Export → R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: nihongo-n3-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare credentials
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || (echo "CLOUDFLARE_API_TOKEN secret이 비어 있습니다." && exit 1)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || (echo "CLOUDFLARE_ACCOUNT_ID secret이 비어 있습니다." && exit 1)

      - name: Resolve R2 reports bucket from wrangler.toml
        id: resources
        run: |
          REPORTS_BUCKET="$(
            awk '
              $0 ~ /binding = "REPORTS"/ { in_reports = 1 }
              in_reports && $0 ~ /bucket_name = / {
                gsub(/.*bucket_name = "/, "", $0)
                gsub(/".*/, "", $0)
                print
                exit
              }
            ' apps/api/wrangler.toml
          )"

          [ -n "$REPORTS_BUCKET" ] || (echo "REPORTS R2 bucket_name을 apps/api/wrangler.toml에서 찾지 못했습니다." && exit 1)
          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Set backup date
        id: date
        env:
          DATE_OVERRIDE: ${{ inputs.date_override || '' }}
        run: |
          if [ -n "$DATE_OVERRIDE" ]; then
            [[ "$DATE_OVERRIDE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || (echo "date_override는 YYYY-MM-DD 형식이어야 합니다." && exit 1)
            echo "date=$DATE_OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Export regular D1 tables
        run: pnpm --filter @nihongo-n3/db exec tsx src/ops/d1-backup.ts --database="$D1_DATABASE_NAME" --out=.artifacts/d1-backup --allow-downtime

      - name: Restore drill on a fresh local D1
        run: |
          set -o pipefail
          pnpm --filter @nihongo-n3/db exec tsx src/ops/d1-restore-drill.ts --input=.artifacts/d1-backup \
            | tee .artifacts/d1-backup/restore-drill.txt

      - name: Record manifest checksum
        run: |
          sha256sum .artifacts/d1-backup/manifest.json \
            | sed 's#  .artifacts/d1-backup/#  #' \
            > .artifacts/d1-backup/manifest.sha256

      - name: Upload non-PII backup evidence
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-evidence-${{ steps.date.outputs.date }}
          path: |
            .artifacts/d1-backup/manifest.json
            .artifacts/d1-backup/manifest.sha256
            .artifacts/d1-backup/restore-drill.txt
          if-no-files-found: error
          retention-days: 30

      - name: Archive verified backup
        run: tar -C .artifacts -czf d1-backup.tar.gz d1-backup

      - name: Upload backup to R2
        run: |
          pnpm exec wrangler r2 object put \
            "${{ steps.resources.outputs.reports_bucket }}/backups/${{ steps.date.outputs.date }}.tar.gz" \
            --file=d1-backup.tar.gz \
            --content-type="application/gzip" \
            --remote

      - name: Confirm upload
        run: |
          echo "백업 완료: ${{ steps.resources.outputs.reports_bucket }}/backups/${{ steps.date.outputs.date }}.tar.gz → R2"

  # ─────────────────────────────────────────────────────────────────
  # 2. R2 lifecycle rule 설정 (30일 자동 만료)
  #    기존 Logpush/alert rule을 보존하고 backups/ rule만 추가·갱신한다.
  # ─────────────────────────────────────────────────────────────────
  setup-lifecycle:
    name: Set R2 Lifecycle Rule (30d)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: backup
    environment:
      name: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare credentials
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || (echo "CLOUDFLARE_API_TOKEN secret이 비어 있습니다." && exit 1)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || (echo "CLOUDFLARE_ACCOUNT_ID secret이 비어 있습니다." && exit 1)

      - name: Resolve R2 reports bucket from wrangler.toml
        id: resources
        run: |
          REPORTS_BUCKET="$(
            awk '
              $0 ~ /binding = "REPORTS"/ { in_reports = 1 }
              in_reports && $0 ~ /bucket_name = / {
                gsub(/.*bucket_name = "/, "", $0)
                gsub(/".*/, "", $0)
                print
                exit
              }
            ' apps/api/wrangler.toml
          )"

          [ -n "$REPORTS_BUCKET" ] || (echo "REPORTS R2 bucket_name을 apps/api/wrangler.toml에서 찾지 못했습니다." && exit 1)
          echo "reports_bucket=$REPORTS_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Replace only the backups lifecycle rule
        env:
          REPORTS_BUCKET: ${{ steps.resources.outputs.reports_bucket }}
        run: |
          set -euo pipefail
          RULES="$(pnpm exec wrangler r2 bucket lifecycle list "$REPORTS_BUCKET")"
          if printf '%s\n' "$RULES" | grep -Fq 'backups-30d-expiry'; then
            pnpm exec wrangler r2 bucket lifecycle remove "$REPORTS_BUCKET" --name backups-30d-expiry
          fi
          pnpm exec wrangler r2 bucket lifecycle add "$REPORTS_BUCKET" backups-30d-expiry backups/ --expire-days 30 --force
          pnpm exec wrangler r2 bucket lifecycle list "$REPORTS_BUCKET"
