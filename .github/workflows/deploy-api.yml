name: Deploy API (Cloudflare Workers)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/shared/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      deployments: write

    outputs:
      worker_url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API auth mode configuration
        env:
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          CF_TEAM_DOMAIN: ${{ secrets.CF_TEAM_DOMAIN }}
        run: |
          AUTH_MODE=$(awk -F ' *= *' '$1 == "AUTH_MODE" { gsub(/"/, "", $2); print $2; exit }' apps/api/wrangler.toml)
          echo "AUTH_MODE=${AUTH_MODE}"
          if [ "$AUTH_MODE" = "cf-access" ]; then
            [ -n "$CF_ACCESS_AUD" ] || (echo "CF_ACCESS_AUD secret is required when AUTH_MODE=cf-access" && exit 1)
            [ -n "$CF_TEAM_DOMAIN" ] || (echo "CF_TEAM_DOMAIN secret is required when AUTH_MODE=cf-access" && exit 1)
          fi

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy

  smoke-test:
    name: Smoke Test — API
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for propagation
        run: sleep 10

      # /api/v1/ping — 공개 엔드포인트, 인증 불필요
      - name: GET /api/v1/ping → 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/json" \
            "${{ vars.API_BASE_URL }}/api/v1/ping")
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ ping 실패: $STATUS" && exit 1)

      # /health — Workers 헬스체크
      - name: GET /health → 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ vars.API_BASE_URL }}/health")
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "❌ health 실패: $STATUS" && exit 1)
