name = "nihongo-n3-api-test"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "test"
AUTH_MODE = "public-owner"
MAINTENANCE_MODE = "off"
RELEASE_SHA = "test"
CF_ACCESS_AUD = "test-aud"
CF_TEAM_DOMAIN = "test.cloudflareaccess.com"
APP_ORIGIN = "http://localhost:5173"
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
GOOGLE_REDIRECT_URI = ""
ADMIN_EMAIL = ""
ADMIN_PASSWORD = ""
ADMIN_BOOTSTRAP_TOKEN = ""
NOTIFY_EMAIL = ""
TTS_PROVIDER = "cloudflare"
GOOGLE_TTS_API_KEY = ""
AZURE_TTS_KEY = ""
AZURE_TTS_REGION = "japaneast"
VOICEVOX_URL = ""
VOICEVOX_SPEAKER = "3"
VOICEVOX_SPEED_SCALE = "0.94"
VOICEVOX_PITCH_SCALE = "0"
VOICEVOX_INTONATION_SCALE = "1.12"
STYLE_BERT_VITS2_URL = ""
FSRS_OPTIMIZER_URL = ""
FSRS_OPTIMIZER_TOKEN = ""
VAPID_PUBLIC_KEY = "test-vapid-public-key"

[[d1_databases]]
binding = "DB"
database_name = "nihongo-n3-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../packages/db/drizzle-v2"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "nihongo-n3-audio-test"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "nihongo-n3-reports-test"

[[unsafe.bindings]]
name = "RATE_LIMITER_PUBLIC"
type = "ratelimit"
namespace_id = "test-public"
simple = { limit = 100, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_AUTH"
type = "ratelimit"
namespace_id = "test-auth"
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_SYNC"
type = "ratelimit"
namespace_id = "test-sync"
simple = { limit = 30, period = 60 }
