name = "nihongo-n3-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Node.js 호환 플래그 활성화 (crypto, stream 등 Node 내장 모듈 사용 가능)
compatibility_flags = ["nodejs_compat"]

# Workers Trace Events를 account-level Logpush job으로 전달합니다.
# 잡과 R2 자격증명은 scripts/setup-logpush.mjs로 별도 관리합니다.
logpush = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
ENVIRONMENT = "production"
AUTH_MODE = "app-session"
MAINTENANCE_MODE = "off"
RELEASE_SHA = "topik-jlpt-cutover-2026-07-20"
APP_ORIGIN = "https://nihongo-n3.pages.dev"
# OAuth callback stays on the Pages origin. The Pages Function proxies this
# route to the Worker, so OAuth state and the app-session cookie share one host.
GOOGLE_REDIRECT_URI = "https://nihongo-n3.pages.dev/api/v1/auth/google/callback"
# CF_ACCESS_AUD / CF_TEAM_DOMAIN are production secrets.
# Set them with:
#   wrangler secret put CF_ACCESS_AUD
#   wrangler secret put CF_TEAM_DOMAIN
# Set AUTH_MODE = "cf-access" after both secrets are configured.
# 주간 리포트 이메일 수신 주소 (MailChannels, 비어 있으면 발송 안 함)
NOTIFY_EMAIL = ""
# TTS 공급자 선택: cloudflare | google | azure | voicevox | style-bert-vits2
TTS_PROVIDER = "cloudflare"
AZURE_TTS_REGION = "japaneast"
VOICEVOX_URL = ""
VOICEVOX_SPEAKER = "3"
VOICEVOX_SPEED_SCALE = "0.94"
VOICEVOX_PITCH_SCALE = "0"
VOICEVOX_INTONATION_SCALE = "1.12"
STYLE_BERT_VITS2_URL = ""
FSRS_OPTIMIZER_URL = ""
# AI learning assistance is fail-closed. This non-secret flag must remain false
# until an operator completes the P5 privacy, budget, and evaluation gates.
AI_ASSISTANCE_ENABLED = "false"
# FSRS_OPTIMIZER_URL 비움 = 개인화 최적화 비활성(정상 운영 모드).
# 활성화 시 외부 optimizer는 FSRS-6 21 weights 응답을 보장해야 합니다.
# GOOGLE_TTS_API_KEY, AZURE_TTS_KEY, FSRS_OPTIMIZER_TOKEN,
# VAPID_PRIVATE_KEY, AUDIO_BATCH_APPROVAL_TOKEN은 `wrangler secret put`으로만 설정합니다.
# AI_ASSISTANCE_BUCKET_SECRET, AI_GATEWAY_BASE_URL, AI_GATEWAY_API_TOKEN은
# `wrangler secret put`으로만 설정합니다. 절대로 VITE_* 또는 [vars]에 넣지 않습니다.
# OBSERVABILITY_CANARY_TOKEN은 preview Worker에만 secret으로 설정하고 production에는 두지 않습니다.
# OBSERVABILITY_API_TOKEN, OBSERVABILITY_ALERT_WEBHOOK_URL/TOKEN은 Worker secret으로 설정합니다.
VAPID_PUBLIC_KEY = "BJHfUCRXkX43H96EVNlG51N9DWgmjcKdPZsPbJftK4I9WX2ym34ckNOJy7k71VXspgQZy9xze_DYzf_V7s_08jw"
OBSERVABILITY_WORKER_NAME = "nihongo-n3-api"

# ─────────────────────────────────────────────────────────────────────────────
# D1 Database
# Blue/Green cutover target. The previous nihongo-n3-prod database remains
# unbound and retained for 30 days after production writes resume on v2.
# ─────────────────────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "nihongo-n3-prod-v2"
database_id = "0a22d92a-4af5-486f-8934-84eb1890835c"
migrations_dir = "../../packages/db/drizzle-v2"

# ─────────────────────────────────────────────────────────────────────────────
# R2 Object Storage
# bucket_name은 wrangler.toml 값 기준으로 배포/백업 워크플로에서 공통 사용합니다.
# ─────────────────────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "nihongo-n3-audio"

# 주간 리포트 + 백업 SQL 저장 버킷
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "nihongo-n3-reports"

# Licensed-content evidence is isolated from audio and operational reports.
# The bucket is intentionally private and must be created by an operator before
# a deployment that uses this binding. No secret belongs in this configuration.
[[r2_buckets]]
binding = "CONTENT_EVIDENCE"
bucket_name = "nihongo-n3-content-evidence"

# Queue carries release/job references, hashes, and idempotency keys only.
[[queues.producers]]
binding = "CONTENT_RELEASE_QUEUE"
queue = "nihongo-n3-content-release"

[[queues.producers]]
binding = "CONTENT_RELEASE_DLQ"
queue = "nihongo-n3-content-release-dlq"

[[queues.consumers]]
queue = "nihongo-n3-content-release"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
retry_delay = 60
dead_letter_queue = "nihongo-n3-content-release-dlq"

[[queues.consumers]]
queue = "nihongo-n3-content-release-dlq"
max_batch_size = 10
max_batch_timeout = 5

[[workflows]]
binding = "CONTENT_RELEASE_WORKFLOW"
name = "nihongo-n3-content-release"
class_name = "ContentReleaseWorkflow"
limits = { steps = 12 }

# ─────────────────────────────────────────────────────────────────────────────
# Cron Triggers
# 매주 일요일 23:00 KST = 14:00 UTC
# ─────────────────────────────────────────────────────────────────────────────
[triggers]
crons = [
  "*/5 * * * *",  # Workers Observability 임계값 판정과 webhook 전달
  "0 14 * * SUN",  # 주간 리포트 (일요일 14:00 UTC)
  "0 15 * * SUN",  # FSRS W 옵티마이저 (일요일 15:00 UTC)
  "0 22 * * *",    # 아침 Push 알림 (KST 07:00 = UTC 22:00 전날)
  "0 13 * * *",    # 취침 전 Push 알림 (KST 22:00 = UTC 13:00)
]

# ─────────────────────────────────────────────────────────────────────────────
# Rate Limiting (Cloudflare Workers Rate Limiting API)
# ─────────────────────────────────────────────────────────────────────────────
[[unsafe.bindings]]
name = "RATE_LIMITER_PUBLIC"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_AUTH"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "RATE_LIMITER_SYNC"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[ai]
binding = "AI"
remote = true

[dev]
port = 8787

# ─────────────────────────────────────────────────────────────────────────────
